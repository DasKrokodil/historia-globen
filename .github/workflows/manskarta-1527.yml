# Tillfälligt (#1527): gör månkartan till månvyn från originalet, med samma metod som i #1528
# (docs/granskningar/2026-11-26-manskarta-14.md): USGS Astropedias LROC WAC Global Morphology Mosaic 100 m (public domain enligt
# produktsidan), gdal_translate -outsize 2048 1024 -r average, gråskala, WebP kvalitet 45 (method 6). Resultatet läggs på en ny gren
# bildbatch/manskarta-1527-<körnings-id> under data/utkast/manskarta-1527/; originalet raderas. Filen tas bort ur grenen när kartan är gjord.
name: Månkarta till månvyn (#1527)

on:
  push:
    branches: ['claude/sweet-wozniak-ksrcu0']
    paths: ['.github/workflows/manskarta-1527.yml']

permissions:
  contents: read

jobs:
  karta:
    name: Hämta och förminska WAC-kartan (kvalitet 45)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Installera GDAL och Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin
          python3 -m pip install pillow
          gdalinfo --version
      - name: Hämta och förminska
        run: |
          set -euo pipefail
          ut=data/utkast/manskarta-1527
          mkdir -p "$ut"
          tmp="$RUNNER_TEMP/wac"; mkdir -p "$tmp"
          UA='HistoriaGlobenBildverktyg/1.1 (https://github.com/DasKrokodil/historia-globen; manskarta-1527)'
          url=https://planetarymaps.usgs.gov/mosaic/Lunar_LRO_LROC-WAC_Mosaic_global_100m_June2013.tif
          curl -sS -L --retry 3 --retry-delay 20 -m 3000 -A "$UA" -o "$tmp/wac.tif" -w 'HTTP %{http_code} %{size_download} byte\n' "$url" | tee "$ut/hamtat.txt"
          sha256sum "$tmp/wac.tif" | sed 's#  .*#  Lunar_LRO_LROC-WAC_Mosaic_global_100m_June2013.tif#' | tee -a "$ut/hamtat.txt"
          gdalinfo "$tmp/wac.tif" | head -40 > "$ut/gdalinfo.txt"
          gdal_translate -q -of PNG -outsize 2048 1024 -r average "$tmp/wac.tif" "$tmp/wac-2048.png"
          rm -f "$tmp/wac.tif"
          python3 - "$tmp/wac-2048.png" "$ut/manen-lroc-wac-2048.webp" <<'PY'
          import sys
          from PIL import Image
          im = Image.open(sys.argv[1]).convert('L')
          assert im.size == (2048, 1024), im.size
          im.save(sys.argv[2], 'WEBP', quality=45, method=6)
          PY
          ls -l "$ut" | tee -a "$ut/hamtat.txt"
          sha256sum "$ut/manen-lroc-wac-2048.webp" | tee -a "$ut/hamtat.txt"
          { echo '### Månkartan (#1527)'; echo '```'; cat "$ut/hamtat.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Lägg resultatet på en ny gren
        run: |
          set -euo pipefail
          gren="bildbatch/manskarta-1527-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$gren"
          git add -f data/utkast/manskarta-1527
          git commit -m "Månkarta till månvyn, gjord från originalet i Actions (#1527)"
          git push origin "$gren"
          echo "Grenen **$gren** har kartan under data/utkast/manskarta-1527/." >> "$GITHUB_STEP_SUMMARY"

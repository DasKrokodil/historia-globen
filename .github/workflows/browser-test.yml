# Webbläsartest (#339, #401, docs/DEPLOYMENT.md): bygger dist/, startar en lokal webbserver och öppnar sidan
# med Playwright i datorbredd (1400 × 900) och mobilbredd (400 × 800). Vanliga körningar använder Chromium;
# release-PR mot production använder dessutom Firefox och WebKit, liksom en pull request mot main med etiketten
# alla-webbläsare (#702), så att en rättning för Firefox eller WebKit kan provas före releasen. Etiketten gäller
# från nästa push, inte i det ögonblick den sätts. Testskriptet är tests/webblasare.mjs.
# Chromium körs i parallella jobb (#864, #1005): tung (lektion och utskrift), dator övrigt, dator länkar och intervall, mobil och kombinationsmatris. Jobben står i
# tests/jobb.json och styrs med BREDD, ENDAST och UTAN; scripts/kontrolltackning.mjs stoppar om en kontroll skulle
# ligga i noll eller flera jobb. Firefox och WebKit körs som förut i ett jobb vardera, se beslutet
# docs/beslut/2026-11-08-webblasartestet-tre-jobb-864.md.
# Playwright används bara här i testerna (Rikards godkännande 2026-10-31); sidan själv får inga nya beroenden.
# Körs vid push till main och vid pull requests mot main och production, som validate-site.yml.
name: Webbläsartest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, production]

permissions:
  contents: read

concurrency:
  group: webblasartest-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: '1.63.0' # exakt version, ändras bara medvetet
  PORT: '8000'

jobs:
  # Bygger jobblistan ur tests/jobb.json och kontrollerar att varje kontroll ligger i exakt ett jobb (#864).
  planera:
    name: Planera webbläsartestets jobb
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Varje kontroll i exakt ett jobb
        run: node scripts/kontrolltackning.mjs
      - name: Bygg jobblistan
        id: plan
        env:
          ALLA: ${{ github.event_name == 'pull_request' && (github.base_ref == 'production' || contains(github.event.pull_request.labels.*.name, 'alla-webbläsare')) }}
        run: |
          # Chromium: ett jobb per post i tests/jobb.json. Firefox och WebKit (bara när ALLA är true): hela sviten i ett jobb.
          matrix=$(node -e '
            const jobb = JSON.parse(require("fs").readFileSync("tests/jobb.json", "utf8"));
            const m = jobb.map(j => ({ browser: "chromium", browserName: "Chromium", jobb: j.id, label: `Chromium, ${j.namn}`, bredd: j.bredd, endast: j.endast, utan: j.utan, timeout: 25 }));
            if (process.env.ALLA === "true") for (const [id, name] of [["firefox", "Firefox"], ["webkit", "WebKit"]]) m.push({ browser: id, browserName: name, jobb: "allt", label: name, bredd: "", endast: "", utan: "", timeout: 45 });
            console.log(JSON.stringify(m));
          ')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  browser:
    needs: planera
    name: Öppna sidan i ${{ matrix.test.label }}
    runs-on: ubuntu-latest
    # Chromium delades i tre jobb (#864) och sedan i fyra (#1005): varje jobb får 25 minuter (mål cirka 15). Före delningen tog allt i ett
    # jobb 24 minuter på main och 30 räckte inte alltid (#863, docs/beslut/2026-11-07-chromium-tidsgrans-30-minuter.md).
    # Firefox och WebKit (bara på release-PR:en) är långsammare utan grafikkort: Firefox nådde 20 minuter utan att bli
    # klar inför v5.0.0, så de får 45 och körs i ett jobb vardera.
    timeout-minutes: ${{ matrix.test.timeout }}
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.planera.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Playwrights webbläsare laddas annars ner på nytt för varje PR. Version och motor
      # ligger i nyckeln, så en medveten uppgradering eller ett annat test får en egen cache.
      - name: Cacha Playwright och npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.npm
          key: playwright-${{ runner.os }}-${{ matrix.test.browser }}-${{ env.PLAYWRIGHT_VERSION }}-v1

      - name: Bygg dist/
        run: bash scripts/build-site.sh

      # Apt-paketen som --with-deps installerar (mest typsnitt) hämtades förr från Ubuntus spegel
      # varje gång, och spegeln var ibland så långsam att installationen slog i taket (#684).
      # Nu sparas .deb-filerna i en egen cache och läggs tillbaka i apt:s arkiv före installationen,
      # så att apt bara installerar dem i stället för att ladda ner. Samma paket som förut, så
      # testmiljön (och typsnitten i skärmbilderna) blir densamma. Nyckeln har Ubuntus kodnamn,
      # så att en ny runner-version får en egen cache.
      - name: Förbered apt-cachen
        id: apt
        run: |
          echo "dist=$(lsb_release -cs)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/apt-debs"
          # apt ska behålla de hämtade paketen i /var/cache/apt/archives så att de kan sparas efteråt
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true"; APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99historia-globen-behall-paket > /dev/null
          sudo rm -f /etc/apt/apt.conf.d/docker-clean

      # Cachen fylls stegvis (#684): nyckeln slutar på en kontrollsumma av filnamnen, och den senaste
      # cachen med samma början hämtas. Varje körning sparar de paket den har (även när installationen
      # stoppades av tidsgränsen), så att en långsam spegel bara behöver ladda ner det som saknas.
      - name: Hämta apt-paketen ur cachen
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/apt-debs
          key: apt-debs-${{ steps.apt.outputs.dist }}-${{ matrix.test.browser }}-${{ env.PLAYWRIGHT_VERSION }}-v2-
          restore-keys: apt-debs-${{ steps.apt.outputs.dist }}-${{ matrix.test.browser }}-${{ env.PLAYWRIGHT_VERSION }}-v2-

      - name: Lägg tillbaka apt-paketen
        run: |
          sudo find "$RUNNER_TEMP/apt-debs" -maxdepth 1 -name '*.deb' -exec cp -t /var/cache/apt/archives/ {} +
          echo "$(find "$RUNNER_TEMP/apt-debs" -maxdepth 1 -name '*.deb' | wc -l) paket ur cachen"

      - name: Installera Playwright och ${{ matrix.test.browserName }} (utanför repot)
        # Egen gräns (#617): steget tar normalt under en minut. Utan apt-cachen (första körningen
        # efter en ny nyckel) hämtas typsnitten från spegeln och kan hänga; då ska installationen
        # bli röd, inte testet stå som avbrutet.
        timeout-minutes: 5
        env:
          BROWSER: ${{ matrix.test.browser }}
        run: |
          # Installeras i en tillfällig mapp, så att repot inte får någon package.json och dist/ inte påverkas
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          if [ "$BROWSER" = chromium ]; then
            "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps --only-shell chromium
          else
            "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps "$BROWSER"
          fi
          # Firefox hittar ingen GL-drivrutin i huvudlöst läge (#702). Det körs i stället med fönster i en virtuell
          # skärm (Xvfb) och ritar WebGL med Mesas mjukvarudrivrutin (llvmpipe). Paketen sparas i apt-cachen nedan.
          if [ "$BROWSER" = firefox ]; then
            sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl-mesa0
          fi

      # Sparas direkt efter installationen, och även när den stoppades av tidsgränsen, så att nästa
      # körning kommer längre. Nyckeln bygger på filnamnen: samma paket som förut sparas inte igen,
      # och en tom cache sparas aldrig.
      - name: Spara apt-paketen i cachen
        id: apt-save
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/apt-debs"
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$RUNNER_TEMP/apt-debs" {} +
          n=$(find "$RUNNER_TEMP/apt-debs" -maxdepth 1 -name '*.deb' | wc -l)
          sum=$(find "$RUNNER_TEMP/apt-debs" -maxdepth 1 -name '*.deb' -printf '%f\n' | sort | sha256sum | cut -c1-16)
          key="apt-debs-${{ steps.apt.outputs.dist }}-${{ matrix.test.browser }}-$PLAYWRIGHT_VERSION-v2-$sum"
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          if [ "$key" = "${{ steps.apt-cache.outputs.cache-matched-key }}" ]; then
            echo "$n paket, samma som i cachen"; echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "$n paket sparas"; echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Ladda upp apt-cachen
        if: always() && steps.apt-save.outputs.new == 'true' && steps.apt-save.outputs.count != '0'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/apt-debs
          key: ${{ steps.apt-save.outputs.key }}

      - name: Starta webbservern för dist/
        run: |
          python3 -m http.server "$PORT" --directory dist > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 50); do curl -sf -o /dev/null "http://localhost:$PORT/" && exit 0; sleep 0.2; done
          echo "::error::webbservern svarar inte"; cat "$RUNNER_TEMP/server.log"; exit 1

      - name: Kör webbläsartestet (tests/webblasare.mjs)
        env:
          BROWSER: ${{ matrix.test.browser }}
          SKARMBILDER: skarmbilder
          # Jobbets urval (#864), ur tests/jobb.json; tomma för Firefox och WebKit, som kör hela sviten
          BREDD: ${{ matrix.test.bredd }}
          ENDAST: ${{ matrix.test.endast }}
          UTAN: ${{ matrix.test.utan }}
        # Firefox körs med fönster i Xvfb (HEADLESS=0), se installationssteget (#702)
        run: |
          if [ "$BROWSER" = firefox ]; then
            HEADLESS=0 NODE_PATH="$RUNNER_TEMP/pw/node_modules" xvfb-run -a -s '-screen 0 1920x1080x24' node tests/webblasare.mjs "$PORT"
          else
            NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/webblasare.mjs "$PORT"
          fi

      - name: Spara skärmbilderna
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skarmbilder-${{ matrix.test.browser }}-${{ matrix.test.jobb }}
          path: skarmbilder/
          if-no-files-found: warn
          retention-days: 14

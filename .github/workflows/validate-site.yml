# Bygger webbplatsen i dist/ och kontrollerar den (docs/DEPLOYMENT.md).
# Körs vid push till main (development) och vid pull requests mot main och production (release).
# Releasekontrollen (from-main) gäller bara pull requests mot production.
name: Validera webbplatsen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, production]

permissions:
  contents: read

jobs:
  validate:
    name: Bygg och validera dist/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bygg dist/ och kör valideringen
        run: bash scripts/build-site.sh
      - name: Kontrollera att JSON Schema stoppar ett medvetet fel
        run: python3 -I tests/validate-schema-test.py
      - name: Kontrollera att redigeringsfilerna för händelser stoppar medvetna fel (#394)
        run: python3 -I tests/dela-data-test.py
      - name: Testa täckningsrapporten med en liten testdata (#563)
        run: python3 -I tests/tackning-test.py
      - name: Kontrollera att significance sitter på exakt de godkända händelserna (#1021)
        run: python3 -I tests/significance-test.py
      - name: Kontrollera att en ombyggnad av rikena behåller flaggor, handskrivna fält och översatta namn (#1220)
        run: python3 -I tests/riken-bevara-test.py
      - name: Kontrollera att bilder_in.py fyller i image för händelser på flera rader och på en rad (#1288)
        run: python3 -I tests/bilder-in-test.py
      - name: Översätt samtidigt - inga nya oöversatta texter och inga inaktuella översättningar (#675)
        run: python3 -I tools/oversattning.py --check
      - name: Kontrollera att texterna per språk och spärren stoppar medvetna fel (#675)
        run: python3 -I tests/oversattning-test.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testa formulärets serverfunktion (functions/api/feedback.js)
        run: node --test 'tests/*.test.mjs'

  pages-function:
    name: Starta formulärets Pages Function som Cloudflare
    # #663: Cloudflare stoppar hela publiceringen om functions/api/feedback.js inte startar i Workers-miljön.
    # Efter #634 hände det i 21 sammanslagningar utan att någon annan kontroll blev röd (#662).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cacha npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: wrangler-${{ runner.os }}-${{ hashFiles('scripts/pages-function-check.sh') }}
      - name: Bygg dist/
        run: bash scripts/build-site.sh
      - name: Starta funktionen med wrangler och anropa /api/feedback
        run: bash scripts/pages-function-check.sh

  from-main:
    name: Release kommer från main
    if: github.event_name == 'pull_request' && github.base_ref == 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Kontrollera att pull requesten mot production kommer från main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "main" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::production uppdateras bara med en pull request från main i samma repo (nu: $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Kontrollera att production inte har egna ändringar som saknas i main
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # production ska bara innehålla det som redan finns i main (docs/DEPLOYMENT.md).
          # Har någon ändrat production direkt (nödläge) måste ändringen först in i main.
          bash scripts/production-i-main.sh "origin/$BASE_REF" "$HEAD_SHA"
          echo "Ändringar som släpps:"
          git log --oneline --first-parent "origin/$BASE_REF..$HEAD_SHA"

# Bildkandidater (#2119, steg 2): kör tools/bildkandidater.py på begäran och lägger listan som en pull request.
# Region 'Alla' kör världsdelarna efter varandra i samma jobb mot samma utdatafil, så att en miss i en region inte
# tappar de andra; period och gräns är valfria (tomt = ingen gräns). Skriptet sparar filen löpande.
# Bara workflow_dispatch (Actions-fliken, "Run workflow"): ingen schedule och ingen push- eller pull_request-trigger.
# Kandidaterna är FÖRSLAG som måste kontrolleras manuellt (docs/bilder-riktiga.md). Flödet ändrar inga fakta och
# rör bara data/utkast/bildkandidater/ (en fil per världsdel och period, #2183), som appen inte läser. Inga hemligheter används; skriptet anropar
# bara Wikidata och Wikimedia Commons med en generisk User-Agent.
# Grenen heter bildkandidater/<körnings-id> och skickas aldrig med force. Får GITHUB_TOKEN inte skapa pull requests
# (repots inställning "Allow GitHub Actions to create and approve pull requests") lämnas grenen och en
# jämförelselänk skrivs i körningens sammanfattning.
name: Bildkandidater

on:
  workflow_dispatch:
    inputs:
      region:
        description: Världsdel (Alla kör alla fem efter varandra)
        required: true
        default: Alla
        type: choice
        options: [Alla, Afrika, Amerika, Asien, Europa, Oceanien]
      period:
        description: 'Period som FRÅN-TILL i astronomiska år, till exempel 1000-1347 eller -800--400. Tom = ingen periodgräns'
        required: false
        default: ''
        type: string
      limit:
        description: Högst så här många händelser per världsdel. Tom eller 0 = ingen gräns
        required: false
        default: ''
        type: string
      exclude_saknas:
        description: Hoppa över händelser som docs/bilder-saknas.md redan listar som utan fri bild
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: bildkandidater
  cancel-in-progress: false

jobs:
  kandidater:
    name: Hämta bildkandidater
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      pull-requests: write
    env:
      REGION: ${{ inputs.region }}
      PERIOD: ${{ inputs.period }}
      LIMIT: ${{ inputs.limit }}
      EXCLUDE_SAKNAS: ${{ inputs.exclude_saknas }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kontrollera indata
        run: |
          # Indata går via miljövariabler (aldrig direkt in i skriptet) och kontrolleras innan de används.
          [[ "$REGION" =~ ^(Alla|Afrika|Amerika|Asien|Europa|Oceanien)$ ]] || { echo "::error::Okänd världsdel"; exit 1; }
          # Tom period = ingen gräns. Annars FRÅN-TILL med valfria minustecken (-800--400, 1000-1347, -500..100).
          [[ -z "$PERIOD" || "$PERIOD" =~ ^-?[0-9]+(--?|\.\.)-?[0-9]+$ ]] || { echo "::error::Perioden måste vara tom eller FRÅN-TILL, till exempel 1000-1347"; exit 1; }
          # Tom eller 0 = ingen gräns.
          [[ -z "$LIMIT" || "$LIMIT" =~ ^[0-9]{1,5}$ ]] || { echo "::error::Gränsen måste vara tom eller ett heltal"; exit 1; }
      - name: Kör tools/bildkandidater.py
        run: |
          # Varje region körs för sig mot samma utdatafil (skriptet behåller poster för andra händelser och sparar
          # löpande). Misslyckas en region går körningen vidare med nästa; steget blir rött först i slutet.
          set +e
          if [ "$REGION" = "Alla" ]; then regioner=(Afrika Amerika Asien Europa Oceanien); else regioner=("$REGION"); fi
          rader="$RUNNER_TEMP/regioner.md"
          {
            echo "| Världsdel | Status | Händelser | Med kandidater | Utan kandidater | Ej hämtade |"
            echo "|---|---|---|---|---|---|"
          } > "$rader"
          fel=0
          for r in "${regioner[@]}"; do
            args=(--region "$r" --sammanfattning "$RUNNER_TEMP/sam-$r.json")
            if [ -n "$PERIOD" ]; then args+=("--period=$PERIOD"); fi
            if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then args+=(--limit "$LIMIT"); fi
            if [ "$EXCLUDE_SAKNAS" = "true" ]; then args+=(--exclude-saknas); fi
            echo "::group::$r"
            echo "python3 tools/bildkandidater.py ${args[*]}"
            python3 tools/bildkandidater.py "${args[@]}" 2>&1 | tee -a "$RUNNER_TEMP/bildkandidater.log"
            kod=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$kod" -eq 0 ]; then status="klar"; else status="MISSLYCKADES (kod $kod)"; fel=1; fi
            if [ -s "$RUNNER_TEMP/sam-$r.json" ]; then
              siffror=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(" | ".join(str(d[k]) for k in ("handelser","med_kandidater","utan_kandidater","ej_hamtade")))' "$RUNNER_TEMP/sam-$r.json")
            else
              siffror="- | - | - | -"
            fi
            echo "| $r | $status | $siffror |" >> "$rader"
          done
          cat "$rader"
          { echo "### Världsdelar"; echo; cat "$rader"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$fel" -ne 0 ]; then echo "::error::Minst en världsdel misslyckades; det som hann sparas läggs ändå på en gren."; fi
          exit "$fel"
      - name: Lägg listan på en ny gren och öppna en pull request
        # Körs även om en region misslyckades, men bara om filen faktiskt har ändrats (annars finns inget att lägga).
        if: always()
        run: |
          set -euo pipefail
          fil=data/utkast/bildkandidater
          if [ -z "$(git status --porcelain -- "$fil")" ]; then
            echo "Ingen ny kandidatlista skapades; ingen gren eller pull request." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gren="bildkandidater/${GITHUB_RUN_ID}"
          urval="${REGION}"
          if [ -n "$PERIOD" ]; then urval="${urval} ${PERIOD}"; fi
          rubrik="Bildkandidater: ${urval} (förslag)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$gren"
          # Grinden (#2183): bara data/utkast/ får vara ändrat. Något annat stoppar körningen före commit.
          andra=$(git status --porcelain | grep -v ' data/utkast/' || true)
          if [ -n "$andra" ]; then echo "::error::Körningen ändrade filer utanför data/utkast/:"; echo "$andra"; exit 1; fi
          git add -f "$fil"
          git commit -m "$rubrik"
          git push origin "$gren"
          {
            echo "Automatiskt förslag från arbetsflödet Bildkandidater (#2119). Körning: ${RUN_URL}"
            echo
            echo "Region: ${REGION}. Period: ${PERIOD:-ingen gräns}. Högst ${LIMIT:-ingen gräns} händelser per världsdel. Utan de som docs/bilder-saknas.md redan listar: ${EXCLUDE_SAKNAS}."
            echo
            echo "Läget per världsdel (en miss i en region tappar inte de andra):"
            echo
            if [ -s "$RUNNER_TEMP/regioner.md" ]; then cat "$RUNNER_TEMP/regioner.md"; else echo "Ingen sammanfattning finns (körningen avbröts innan någon världsdel var klar)."; fi
            echo
            cat <<'TEXT'
          **Kandidaterna är förslag och måste kontrolleras manuellt.** För varje kandidat finns filsidan på Wikimedia Commons, licensen ("trolig" ur Commons API, "flagga" när en människa måste bedöma den; filsidans licensmall kontrolleras med tools/bildbatch.py --licens eller tools/bild_hamta.py), upphovsperson och motiv. Öppna filsidan, läs licensmallen och kontrollera att bilden visar själva händelsen (inte en karta eller en nutida minnessten) innan den används, enligt docs/bilder-riktiga.md.

          - Inga fakta ändras: bara filerna i data/utkast/bildkandidater/ för de världsdelar och perioder som kördes ändras.
          - Appen läser inte data/utkast/, så ingenting syns på sidan.
          - Ingen bild är vald eller hämtad; en kandidat blir en bild först efter källkontroll i ett eget issue.
          - "Ej hämtade" betyder att Wikimedia inte svarade (till exempel 429) efter tre försök; kör om för just den världsdelen.
          TEXT
          } > "$RUNNER_TEMP/pr-text.md"
          if gh pr create --base main --head "$gren" --title "$rubrik" --body-file "$RUNNER_TEMP/pr-text.md"; then
            echo "Pull request skapad för $gren." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GITHUB_TOKEN fick inte skapa pull request. Grenen ligger kvar."
            {
              echo "### Grenen är pushad, men pull requesten skapades inte"
              echo "Repots inställning tillåter inte att GITHUB_TOKEN skapar pull requests. Öppna den själv:"
              echo
              echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${gren}?expand=1"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

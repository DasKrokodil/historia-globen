<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Historia-globens ikon: djupblått klot med pergamentland och en mässingsring, på natthimmel -->
  <defs>
    <clipPath id="klot"><circle cx="32" cy="32" r="19"/></clipPath>
    <!-- Ringens främre halva: nedanför klotets mittlinje, vriden som ringen -->
    <clipPath id="fram"><rect x="-10" y="32" width="84" height="40" transform="rotate(-24 32 32)"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b1219"/>
  <ellipse cx="32" cy="32" rx="26" ry="9" fill="none" stroke="#9c7a3c" stroke-width="3.2" transform="rotate(-24 32 32)"/>
  <circle cx="32" cy="32" r="19" fill="#13324a"/>
  <g clip-path="url(#klot)" fill="#c8b48a">
    <path d="M14 22c4-5 10-7 15-6 3 1 4 4 2 6-2 2-6 1-7 4-1 3 3 5 2 8-1 3-5 3-7 1-3-3-7-7-5-13z"/>
    <path d="M35 14c5-1 11 1 15 5 2 3 1 6-2 7-3 1-4-2-7-1-2 1-1 5-4 6-3 1-5-2-5-6 0-4 0-10 3-11z"/>
    <path d="M37 36c3-2 7-1 9 2 2 3 1 8-2 11-2 2-5 1-6-2-1-3-3-4-3-7 0-2 0-3 2-4z"/>
  </g>
  <g clip-path="url(#fram)">
    <ellipse cx="32" cy="32" rx="26" ry="9" fill="none" stroke="#d6b06a" stroke-width="3.2" transform="rotate(-24 32 32)"/>
  </g>
</svg>

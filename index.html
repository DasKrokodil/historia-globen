<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Historia-globen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <canvas id="globe-canvas" class="globe-canvas" tabindex="0" role="application" aria-label="Snurrbar jordglob. Dra för att snurra, scrolla eller nyp för att zooma. Med tangentbord: piltangenter snurrar, plus och minus zoomar. Händelserna finns också i listan Samtidigt i världen."></canvas>
  <div id="labels" class="labels"></div>

  <header class="masthead">
    <h1 class="brand">Historia-globen</h1>
    <div class="year-readout" aria-live="polite">
      <button id="year-jump" class="year-jump" type="button" aria-expanded="false" aria-controls="jump-pop" title="Hoppa till ett år">
        <span id="year-big" class="year-big">1325</span>
        <span id="year-era" class="year-era"></span>
      </button>
    </div>
    <p id="year-segment" class="segment-note"></p>
    <form id="jump-pop" class="jump-pop" hidden autocomplete="off" aria-label="Hoppa till år">
      <label class="jump-label" for="jump-input">Hoppa till år</label>
      <div class="jump-row">
        <input id="jump-input" class="jump-input" type="text" inputmode="numeric" enterkeyhint="go" placeholder="till exempel 1969" aria-describedby="jump-msg">
        <div class="jump-era" role="group" aria-label="Tideräkning">
          <button type="button" class="jump-era-btn" data-era="bce" aria-pressed="false">f.Kr.</button>
          <button type="button" class="jump-era-btn" data-era="ce" aria-pressed="true">e.Kr.</button>
        </div>
        <button type="submit" class="jump-go">Gå</button>
      </div>
      <p id="jump-msg" class="jump-msg" role="alert"></p>
      <div id="jump-epochs" class="jump-epochs"></div>
    </form>
  </header>

  <div class="top-actions">
    <button id="btn-panel" class="chip-btn panel-toggle" type="button" aria-expanded="false" aria-controls="panel">Samtidigt <span id="panel-count" class="count">0</span></button>
    <button id="btn-layers" class="chip-btn" type="button" aria-expanded="false" aria-controls="layer-menu">Lager</button>
    <button id="btn-focus" class="chip-btn" type="button" aria-expanded="false" aria-controls="focus-menu">Fokus</button>
    <button id="btn-flat" class="chip-btn" type="button" aria-pressed="false" title="Visa bilden som en fysisk glob skulle få">Platt vy</button>
    <button id="btn-sources" class="chip-btn" type="button">Om källorna</button>
  </div>

  <aside id="religion-legend" class="religion-legend" aria-label="Teckenförklaring för religioner" hidden></aside>
  <div id="religion-pop" class="religion-pop" role="dialog" aria-label="Religion i området" hidden></div>

  <div id="focus-menu" class="layer-menu" hidden role="group" aria-label="Fokus"></div>

  <div id="layer-menu" class="layer-menu" hidden role="group" aria-label="Lager">
    <label class="layer-row"><input type="checkbox" data-layer="events" checked> Händelser</label>
    <label class="layer-row"><input type="checkbox" data-layer="funfacts" checked aria-label="Visa Samtidigt-kortet"> Samtidigt-kortet <span class="layer-note">fun facts och annat som hände samtidigt</span></label>
    <label class="layer-row"><input type="checkbox" data-layer="areas" checked> Riken</label>
    <label class="layer-row"><input type="checkbox" data-layer="religions"> Religioner <span class="layer-note">rikenas officiella religion · ljus med streckad kant = osäker uppgift</span></label>
    <div id="religion-list" class="layer-sub" role="group" aria-label="Religioner" hidden></div>
    <label class="layer-row"><input type="checkbox" data-layer="borders"> Dagens gränser <span class="layer-note">stämmer inte historiskt</span></label>
    <div class="layer-heading">Kategorier</div>
    <div id="filters" class="filters" role="group" aria-label="Kategorier"></div>
    <div class="layer-heading">Pausa uppspelningen vid</div>
    <label class="layer-row"><input type="checkbox" data-pause="funfacts" checked aria-label="Pausa vid Samtidigt-kortet"> Samtidigt-kortet <span class="layer-note">fun facts och annat som hände samtidigt</span></label>
    <label class="layer-row"><input type="checkbox" data-pause="wars"> När ett krig bryter ut</label>
    <label class="layer-row"><input type="checkbox" data-pause="major" checked> Stora händelser när man följer ett krig</label>
    <label class="layer-row"><input type="checkbox" data-pause="empire" checked> Nyckelår när man följer ett rike <span class="layer-note">varför riket växer eller krymper</span></label>
  </div>

  <aside id="panel" class="panel" aria-label="Samtidigt i världen">
    <div class="panel-head">
      <button id="panel-close" type="button" class="panel-x" aria-label="Stäng">×</button>
      <h2>Samtidigt i världen</h2>
      <p id="panel-sub" class="panel-sub"></p>
      <p class="panel-hint">Välj kategorier under Lager.</p>
    </div>
    <div id="event-list" class="event-list"></div>
  </aside>

  <section id="detail" class="detail detail-card" hidden aria-live="polite" aria-label="Om händelsen"></section>

  <section id="funfact" class="funfact" hidden aria-live="polite">
    <div id="ff-pics" class="ff-pics" hidden></div>
    <div class="ff-eyebrow">
      <span><span class="ff-pre">Samtidigt <span class="ff-sep">·</span> </span><span id="ff-kind" class="ff-kind">Fun fact</span></span>
      <span class="ff-right"><span id="ff-pager" class="ff-pager"></span>
        <button id="ff-min" class="ff-min" type="button" aria-label="Fäll ihop Samtidigt-kortet" title="Fäll ihop">–</button></span>
    </div>
    <p id="ff-text" class="ff-text"></p>
    <div id="ff-events" class="ff-events"></div>
    <div class="ff-foot">
      <span id="ff-review" class="review-badge"></span>
      <button id="ff-sources" class="link-btn" type="button">Källor</button>
      <button id="ff-next" class="link-btn" type="button" hidden>Nästa</button>
    </div>
  </section>

  <button id="ff-tab" class="ff-tab" type="button" hidden aria-label="Visa Samtidigt-kortet">Samtidigt <span id="ff-tab-count" class="count">1</span></button>

  <div id="flat-view" class="flat-view" hidden>
    <div class="flat-inner">
      <p class="flat-cap">Så här ser bilden ut innan den läggs på klotet. Samma ekvirektangulära bild kan skickas till en fysisk globskärm.</p>
      <canvas id="flat-canvas" class="flat-canvas"></canvas>
    </div>
  </div>

  <div id="focus-bar" class="focus-bar" hidden>
    <span class="focus-label">Fokus</span> <span id="focus-title" class="focus-title"></span>
    <button id="focus-facts" class="chip-btn" type="button" hidden aria-controls="detail">Fakta</button>
    <button id="focus-exit" class="chip-btn" type="button">Tillbaka till hela tiden</button>
    <div id="focus-moved" class="focus-moved" hidden role="status">
      <span id="focus-moved-text"></span>
      <button id="focus-moved-back" class="link-btn" type="button"></button>
    </div>
  </div>

  <footer class="timebar">
    <div id="pause-note" class="pause-note" role="status" hidden>
      <span id="pause-text"></span>
      <button id="pause-go" class="pause-go" type="button">&#9654; Fortsätt</button>
    </div>
    <div class="controls">
      <button class="step" type="button" data-step="-100" aria-label="100 år bakåt">−100</button>
      <button class="step" type="button" data-step="-10" aria-label="10 år bakåt">−10</button>
      <button class="step" type="button" data-step="-1" aria-label="1 år bakåt">−1</button>
      <button id="btn-play" class="play" type="button" aria-label="Spela upp tiden" aria-pressed="false">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path id="play-icon" d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>
      </button>
      <button class="step" type="button" data-step="1" aria-label="1 år framåt">+1</button>
      <button class="step" type="button" data-step="10" aria-label="10 år framåt">+10</button>
      <button class="step" type="button" data-step="100" aria-label="100 år framåt">+100</button>
      <button id="btn-speed" class="step speed" type="button" title="Uppspelningshastighet: 25 år/s">25 år/s</button>
    </div>
    <div id="track" class="track" role="slider" tabindex="0" aria-label="År" aria-valuemin="-2999" aria-valuemax="2026">
      <div class="track-segments" id="track-segments"></div>
      <div class="track-dots" id="track-dots"></div>
      <div class="track-ff" id="track-ff"></div>
      <div class="thumb" id="thumb"><span class="thumb-line"></span></div>
      <div class="ticks" id="ticks"></div>
    </div>
  </footer>

  <div id="sources-dialog" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sources-title">
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2 id="sources-title">Om källorna</h2>
        <button id="sources-close" class="chip-btn" type="button">Stäng</button>
      </div>
      <div id="sources-body" class="sheet-body"></div>
    </div>
  </div>

  <div id="loading" class="loading">Laddar globen…</div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
